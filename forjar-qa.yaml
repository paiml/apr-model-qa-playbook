version: "1.0"
name: apr-qa-certify
description: >
  Model qualification pipeline on Intel Mac Pro. Three tiers per model
  (dim-smoke → smoke → mvp), skip already-certified, evict HF cache
  after certification. Replaces qa-loop.sh + qa-jobs.sh + run-qa-intel.sh.

params:
  qa_repo: /home/noah/src/apr-model-qa-playbook
  evidence_dir: /home/noah/data/qa-evidence
  pass_threshold: 50

machines:
  intel:
    hostname: localhost
    addr: localhost
    user: noah
    arch: x86_64

resources:
  # ── Tier 0: Build apr-qa binary ────────────────────────────────
  build:
    type: task
    machine: intel
    working_dir: "{{params.qa_repo}}"
    completion_check: "test -x target/release/apr-qa"
    command: |
      git pull --rebase origin main 2>/dev/null || true
      cargo build --release --bin apr-qa 2>&1 | tail -3
    timeout: 300

  # ── Tier 1: Dimensional smoke (metadata-only, <60s) ────────────
  dim-smoke:
    type: task
    machine: intel
    for_each:
      - smollm2-135m
      - smollm2-360m
      - qwen2.5-coder-0.5b
      - qwen3-0.6b
      - tinyllama-1.1b
