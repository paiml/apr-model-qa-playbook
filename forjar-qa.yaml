      - qwen2.5-coder-1.5b
      - qwen2.5-1.5b
      - deepseek-r1-distill-qwen-1.5b
      - stablelm-2-zephyr-1.6b
      - qwen3-1.7b
      - smollm2-1.7b
      - granite-3.1-2b
      - qwen2.5-3b
      - qwen2.5-coder-3b
      - granite-3b-code
      - stablelm-zephyr-3b
      - starcoder2-3b
      - gemma-3-1b
      - nemotron-nano-4b
      - qwen3-4b
      - phi-4-mini
      - phi-3.5-mini
      - gemma-3-4b
      - yi-1.5-6b
      - deepseek-coder-6.7b
      - deepseek-coder-7b
      - qwen2.5-7b
      - qwen2.5-coder-7b
      - deepseek-r1-distill-qwen-7b
      - falcon-7b
      - dolphin-2.6-mistral-7b
      - openchat-3.5
      - openhermes-2.5-mistral-7b
      - zephyr-7b-beta
      - internlm2.5-7b
      - starcoder2-7b
      - olmo-2-7b
      - codegemma-7b
      - codellama-7b
      - llama-3.1-8b
      - deepseek-r1-distill-llama-8b
      - granite-3.1-8b
      - hermes-3-llama-3.1-8b
      - dolphin3.0-llama3.1-8b
      - qwen3-8b
      - phi-3-small-8k
      - gemma-2-9b
      - yi-1.5-9b
      - mistral-nemo-12b
      - gemma-3-12b
      - olmo-2-13b
      - codellama-13b
      - vicuna-13b
      - qwen2.5-14b
      - qwen2.5-coder-14b
      - qwen3-14b
      - deepseek-r1-distill-qwen-14b
      - phi-3-medium-4k
      - starcoder2-15b
      - deepseek-coder-v2-lite
      - wizardcoder-15b
      - internlm2.5-20b
      - codestral-22b
      - mistral-small-24b
      - gemma-2-27b
      - gemma-3-27b
      - qwen3-30b-a3b
      - qwen3-coder-30b-a3b
      - qwen2.5-32b
      - qwen2.5-coder-32b
      - qwen3-32b
      - qwq-32b
      - deepseek-r1-distill-qwen-32b
      - deepseek-coder-33b
      - wizardcoder-33b
      - codellama-34b
      - yi-1.5-34b
      - falcon-40b
      - codellama-70b
      - llama-3.1-70b
      - llama-3.3-70b
      - deepseek-r1-distill-llama-70b
      - nemotron-70b
      - qwen2.5-72b
      - qwen3-coder-next
      - vicuna-7b
    depends_on: [build]
    working_dir: "{{params.qa_repo}}"
    timeout: 120
    completion_check: "test -d certifications/{{item}} && find certifications/{{item}} -name evidence.json -newer playbooks/models/{{item}}-dim-smoke.playbook.yaml 2>/dev/null | grep -q ."
    pre_apply: |
      test -f "playbooks/models/{{item}}-dim-smoke.playbook.yaml" || exit 1
    command: |
      rm -rf output
      cargo run --release --bin apr-qa -- run \
        "playbooks/models/{{item}}-dim-smoke.playbook.yaml" \
        --no-gpu \
        --failure-policy fail-fast \
        --workers 1 \
        --timeout 30000 \
        --metadata-only
    output_artifacts:
      - "output/evidence.json"

  # ── Tier 2: Smoke (3 tests, quick inference, ~2-5 min) ─────────
  smoke:
    type: task
    machine: intel
    for_each:
      - smollm2-135m
      - smollm2-360m
      - qwen2.5-coder-0.5b
      - qwen3-0.6b
      - tinyllama-1.1b
      - deepseek-coder-1.3b
      - qwen2.5-coder-1.5b
      - qwen2.5-1.5b
      - deepseek-r1-distill-qwen-1.5b
      - stablelm-2-zephyr-1.6b
      - qwen3-1.7b
      - smollm2-1.7b
      - granite-3.1-2b
      - qwen2.5-3b
      - qwen2.5-coder-3b
      - granite-3b-code
      - stablelm-zephyr-3b
      - starcoder2-3b
      - gemma-3-1b
      - nemotron-nano-4b
      - qwen3-4b
      - phi-4-mini
      - phi-3.5-mini
      - gemma-3-4b
      - yi-1.5-6b
      - deepseek-coder-6.7b
      - deepseek-coder-7b
      - qwen2.5-7b
      - qwen2.5-coder-7b
      - deepseek-r1-distill-qwen-7b
      - falcon-7b
      - dolphin-2.6-mistral-7b
      - openchat-3.5
      - openhermes-2.5-mistral-7b
      - zephyr-7b-beta
      - internlm2.5-7b
      - starcoder2-7b
      - olmo-2-7b
      - codegemma-7b
      - codellama-7b
      - llama-3.1-8b
      - deepseek-r1-distill-llama-8b
      - granite-3.1-8b
      - hermes-3-llama-3.1-8b
      - dolphin3.0-llama3.1-8b
      - qwen3-8b
      - phi-3-small-8k
      - gemma-2-9b
      - yi-1.5-9b
      - mistral-nemo-12b
      - gemma-3-12b
      - olmo-2-13b
      - codellama-13b
      - vicuna-13b
      - qwen2.5-14b
      - qwen2.5-coder-14b
      - qwen3-14b
      - deepseek-r1-distill-qwen-14b
      - phi-3-medium-4k
      - starcoder2-15b
      - deepseek-coder-v2-lite
      - wizardcoder-15b
      - internlm2.5-20b
      - codestral-22b
      - mistral-small-24b
      - gemma-2-27b
      - gemma-3-27b
      - qwen3-30b-a3b
      - qwen3-coder-30b-a3b
      - qwen2.5-32b
      - qwen2.5-coder-32b
      - qwen3-32b
      - qwq-32b
      - deepseek-r1-distill-qwen-32b
      - deepseek-coder-33b
      - wizardcoder-33b
      - codellama-34b
      - yi-1.5-34b
      - falcon-40b
      - codellama-70b
      - llama-3.1-70b
      - llama-3.3-70b
      - deepseek-r1-distill-llama-70b
      - nemotron-70b
      - qwen2.5-72b
      - qwen3-coder-next
      - vicuna-7b
    depends_on: ["dim-smoke-{{item}}"]
    working_dir: "{{params.qa_repo}}"
    timeout: 600
    completion_check: "test ! -f playbooks/models/{{item}}-smoke.playbook.yaml || (test -d certifications/{{item}} && find certifications/{{item}} -name evidence.json -newer playbooks/models/{{item}}-smoke.playbook.yaml 2>/dev/null | grep -q .)"
    command: |
      test -f "playbooks/models/{{item}}-smoke.playbook.yaml" || exit 0
      rm -rf output
      cargo run --release --bin apr-qa -- run \
        "playbooks/models/{{item}}-smoke.playbook.yaml" \
        --no-gpu \
        --failure-policy stop-on-p0 \
        --workers 1 \
        --timeout 120000

  # ── Tier 3: MVP (full test matrix, ~15-60 min) ─────────────────
  mvp:
    type: task
    machine: intel
    for_each:
      - smollm2-135m
      - smollm2-360m
      - qwen2.5-coder-0.5b
      - qwen3-0.6b
      - tinyllama-1.1b
      - deepseek-coder-1.3b
      - qwen2.5-coder-1.5b
      - qwen2.5-1.5b
      - deepseek-r1-distill-qwen-1.5b
      - stablelm-2-zephyr-1.6b
      - qwen3-1.7b
      - smollm2-1.7b
      - granite-3.1-2b
      - qwen2.5-3b
      - qwen2.5-coder-3b
      - granite-3b-code
      - stablelm-zephyr-3b
      - starcoder2-3b
      - gemma-3-1b
      - nemotron-nano-4b
      - qwen3-4b
      - phi-4-mini
      - phi-3.5-mini
      - gemma-3-4b
      - yi-1.5-6b
      - deepseek-coder-6.7b
      - deepseek-coder-7b
      - qwen2.5-7b
      - qwen2.5-coder-7b
      - deepseek-r1-distill-qwen-7b
      - falcon-7b
      - dolphin-2.6-mistral-7b
      - openchat-3.5
      - openhermes-2.5-mistral-7b
      - zephyr-7b-beta
      - internlm2.5-7b
      - starcoder2-7b
      - olmo-2-7b
      - codegemma-7b
      - codellama-7b
      - llama-3.1-8b
      - deepseek-r1-distill-llama-8b
      - granite-3.1-8b
      - hermes-3-llama-3.1-8b
      - dolphin3.0-llama3.1-8b
      - qwen3-8b
      - phi-3-small-8k
      - gemma-2-9b
      - yi-1.5-9b
      - mistral-nemo-12b
      - gemma-3-12b
      - olmo-2-13b
      - codellama-13b
      - vicuna-13b
      - qwen2.5-14b
      - qwen2.5-coder-14b
      - qwen3-14b
      - deepseek-r1-distill-qwen-14b
      - phi-3-medium-4k
      - starcoder2-15b
      - deepseek-coder-v2-lite
      - wizardcoder-15b
      - internlm2.5-20b
      - codestral-22b
      - mistral-small-24b
      - gemma-2-27b
      - gemma-3-27b
      - qwen3-30b-a3b
      - qwen3-coder-30b-a3b
      - qwen2.5-32b
      - qwen2.5-coder-32b
      - qwen3-32b
      - qwq-32b
      - deepseek-r1-distill-qwen-32b
      - deepseek-coder-33b
      - wizardcoder-33b
      - codellama-34b
      - yi-1.5-34b
      - falcon-40b
      - codellama-70b
      - llama-3.1-70b
      - llama-3.3-70b
      - deepseek-r1-distill-llama-70b
      - nemotron-70b
      - qwen2.5-72b
      - qwen3-coder-next
      - vicuna-7b
    depends_on: ["smoke-{{item}}"]
    working_dir: "{{params.qa_repo}}"
    timeout: 7200
    completion_check: "test -f certifications/{{item}}/evidence.json && test certifications/{{item}}/evidence.json -nt playbooks/models/{{item}}-mvp.playbook.yaml && scripts/check-certified.sh certifications/{{item}}/evidence.json {{params.pass_threshold}}"
    pre_apply: |
      test -f "playbooks/models/{{item}}-mvp.playbook.yaml" || exit 1
      usage="$(df --output=pcent /home/noah 2>/dev/null | tail -1 | tr -d ' %')"
      if [ "$usage" -ge 90 ]; then
        echo "disk: ${usage}% used, skipping {{item}} until space freed"
        exit 1
      fi
    command: |
      rm -rf output
      mkdir -p "{{params.evidence_dir}}/{{item}}"
      cargo run --release --bin apr-qa -- run \
        "playbooks/models/{{item}}-mvp.playbook.yaml" \
        --no-gpu \
        --failure-policy stop-on-p0 \
        --workers 4 \
        --timeout 300000 \
        2>&1 | tee "{{params.evidence_dir}}/{{item}}/run.log"

      if [ -f output/evidence.json ]; then
        cp output/evidence.json "{{params.evidence_dir}}/{{item}}/"
        mkdir -p "certifications/{{item}}"
        cp output/evidence.json "certifications/{{item}}/evidence.json"
      fi

      rate="$(scripts/pass-rate.sh output/evidence.json)"
      echo "result: {{item}}: ${rate}% pass rate"
      scripts/check-certified.sh output/evidence.json "{{params.pass_threshold}}"
    output_artifacts:
      - "certifications/{{item}}/evidence.json"
    post_apply: |
      cd "{{params.qa_repo}}" || exit 1
      git add "certifications/{{item}}/evidence.json" 2>/dev/null || true
      git commit -m "qa: certify {{item}} (mvp) (Refs #10)" 2>/dev/null || true
      git push origin main 2>/dev/null || true

      hf_repo="$(grep 'hf_repo:' "playbooks/models/{{item}}-mvp.playbook.yaml" | head -1 | sed "s/.*hf_repo:\s*[\"']\?\([^\"']*\)[\"']\?.*/\1/")"
      cache_dir="$HOME/.apr/cache/hf/${hf_repo:?}"
      if [ -d "$cache_dir" ] && [ -n "$cache_dir" ]; then
        size="$(du -sm "$cache_dir" 2>/dev/null | cut -f1 || echo 0)"
        rm -rf "${cache_dir:?}" || exit 1
        echo "evict: Freed ${size}MB from HF cache: $hf_repo"
      fi

      for subdir in "{{params.evidence_dir}}/{{item}}"/workspace "{{params.evidence_dir}}/{{item}}"/conversions; do
        if [ -d "$subdir" ] && [ -n "$subdir" ]; then
          rm -rf "${subdir:?}" || exit 1
        fi
      done
      rm -rf output || true

policy:
  failure: continue_independent
  parallel_machines: false
  tripwire: true
  lock_file: true
  post_apply: |
    echo "=== Certification run complete ==="
    cd /home/noah/src/apr-model-qa-playbook
    cargo run --release --bin apr-qa -- export-csv docs/certifications/models.csv 2>/dev/null || true
    git add docs/certifications/models.csv 2>/dev/null || true
    git commit -m "qa: update models.csv after certification batch (Refs #10)" 2>/dev/null || true
    git push origin main 2>/dev/null || true
